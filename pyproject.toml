[project]
name = "flashcard-quiz"
version = "0.1.0"
description = "A command-line flashcard quiz for practising Japanese: Hiragana, Katakana, Kanji and grammar."
readme = "README.md"
authors = [
    { name = "chaiyanunSaku", email = "ongleesaku@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
flashcard-quiz = "flashcard_quiz:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
